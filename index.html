<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <script>
      try {
        var t = localStorage.getItem('togurumi-theme');
        if (t === 'day' || t === 'night' || t === 'system') document.documentElement.dataset.theme = t;
        var l = localStorage.getItem('togurumi-locale');
        var lang = 'en-US';
        if (l === 'pt-BR') lang = 'pt-BR';
        else if (l === 'en-US') lang = 'en-US';
        else lang = (navigator.language || '').toLowerCase().startsWith('pt') ? 'pt-BR' : 'en-US';
        document.documentElement.lang = lang;
      } catch (e) {}
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Nunito Sans and Fraunces are served from this site and preloaded, so they arrive with the
      app bundle and the first paint already uses them: no fallback font that later swaps in
      (the "heavier text that shrinks" seen on the buttons). font-display: block keeps the text
      hidden for the short moment instead of drawing it in another font.
      Each Nunito weight is its own face over the same variable file, clamped to the four
      weights the site always used (400, 600, 700, 800), so text keeps its old weight.
    -->
    <link rel="preload" href="/fonts/nunito-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fraunces-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin />
